name: Build GRSP Correlator Windows EXE

on:
  workflow_dispatch:
  push:
    paths:
      - 'GRSP_Correlator.py'
      - 'Run_Correlator.bat'
      - 'README.md'
      - 'OUTPUT_SCHEMA.md'
      - 'VALIDATION.md'
      - 'RELEASE_NOTES.md'
      - 'MANIFEST.json'
      - 'VERSION.txt'
      - '.github/workflows/build-correlator.yml'
  pull_request:
    paths:
      - 'GRSP_Correlator.py'
      - 'Run_Correlator.bat'
      - 'README.md'
      - 'OUTPUT_SCHEMA.md'
      - 'VALIDATION.md'
      - 'RELEASE_NOTES.md'
      - 'MANIFEST.json'
      - 'VERSION.txt'
      - '.github/workflows/build-correlator.yml'

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Build one-file executable
        run: pyinstaller --noconfirm --clean --onefile --console --name GRSP-Correlator GRSP_Correlator.py

      - name: Stage package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path stage | Out-Null
          Copy-Item dist\GRSP-Correlator.exe stage\GRSP-Correlator.exe
          Copy-Item Run_Correlator.bat stage\Run_Correlator.bat
          Copy-Item README.md stage\README.md
          Copy-Item OUTPUT_SCHEMA.md stage\OUTPUT_SCHEMA.md
          Copy-Item VERSION.txt stage\VERSION.txt

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: GRSP-Correlator-0.1.2-Windows-x64
          path: stage
